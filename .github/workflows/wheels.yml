name: Wheels

# Build sdist + wheel for all uv workspace packages (pure Python).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "ci-*"
    tags:
      - "*"

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: res_mapf

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist and wheels
        run: uv build --all-packages

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: res-mapf-dist
          path: |
            res_mapf/dist/*.whl
            res_mapf/dist/*.tar.gz

  smoke:
    name: Install wheels smoke
    needs: build
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-26]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v7
        with:
          name: res-mapf-dist
          path: dist

      - name: Install from wheels
        env:
          CFLAGS: ${{ runner.os == 'macOS' && '-fno-define-target-os-macros' || '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dist/res_mapf_planning-*.whl \
            dist/res_plan_execution-*.whl \
            dist/res_plan_server-*.whl \
            dist/res_pybullet-*.whl \
            dist/res_mapf-*.whl

      - name: Import smoke
        run: |
          python -c "import res_mapf_planning, res_plan_execution, res_plan_server, res_pybullet, res_mapf"
